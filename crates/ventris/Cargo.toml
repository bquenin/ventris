[package]
name = "ventris"
version = "0.2.0"
description = "Game translation patch engine: script extraction and reinsertion for ROMs and disc images"
edition = "2024"
license = "MIT"

[lib]
name = "ventris"

[[bin]]
name = "ventris"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.10"
thiserror = "2"
toml = "1.2.1"

[dev-dependencies]
tempfile = "3"
