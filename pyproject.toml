[project]
name = "ventris-workbench"
version = "0.2.0"
description = "Tools for taking a game apart, for the ventris translation patch engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "qube" }
]
dependencies = []

[project.scripts]
ventris-workbench = "ventris_workbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ventris_workbench"]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "RUF001", # ambiguous unicode (intentional Japanese punctuation)
    "SIM108", # ternary operator (multi-line if/else is clearer)
]

[tool.ruff.lint.isort]
known-first-party = ["ventris_workbench"]
